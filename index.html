<!DOCTYPE html>
<html lang="en" data-pal="logo">
<head>
<meta charset="utf-8">
<title>Myine</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f6f4fb;--card:#fff;--ink:#1b1530;--mute:#756d8c;--line:#e8e4f2;--p:#6d3df0;--p2:#e0479e;--soft:#efe9ff;--you:#fff;--sh:0 1px 2px rgba(27,21,48,.06),0 4px 14px rgba(27,21,48,.05);--g:linear-gradient(135deg,#6d3df0,#e0479e);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0a1a;--card:#171227;--ink:#f2edff;--mute:#9f94bc;--line:#261e3d;--soft:#241a45;--you:#211a38;--sh:0 1px 2px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{--bg:#0e0a1a;--card:#171227;--ink:#f2edff;--mute:#9f94bc;--line:#261e3d;--soft:#241a45;--you:#211a38;--sh:0 1px 2px rgba(0,0,0,.4)}

:root{--on:#fff}
:root[data-pal="logo"]{--bg:#000;--card:#0c0810;--ink:#fff;--mute:#a99dbb;--line:#26192f;--p:#ec3a97;--p2:#8b3cf0;--soft:#2a1235;--you:#1a1222;--sh:none;--g:linear-gradient(135deg,#ff3d8b,#8a2fee);--on:#fff}
:root[data-pal="white"]{--bg:#fff;--card:#fff;--ink:#0a0a0a;--mute:#6b6b6b;--line:#e4e4e4;--p:#000;--p2:#000;--soft:#f0f0f0;--you:#f1f1f1;--sh:none;--g:linear-gradient(135deg,#000,#3a3a3a);--on:#fff}
:root[data-pal="black"]{--bg:#000;--card:#0b0b0b;--ink:#fff;--mute:#9a9a9a;--line:#262626;--p:#fff;--p2:#fff;--soft:#1c1c1c;--you:#1b1b1b;--sh:none;--g:linear-gradient(135deg,#fff,#c4c4c4);--on:#000}
:root[data-pal="white"] .av{filter:grayscale(1)}
:root[data-pal="white"] .av.on::after{background:var(--ink)}
:root[data-pal="white"] .ch .grow small{color:var(--mute)}
:root[data-pal="white"] .btn,:root[data-pal="white"] .radar i{box-shadow:none}
:root[data-pal="white"] .mask{border-radius:26px}
*{box-sizing:border-box;margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
html,body{height:100%;background:var(--bg);color:var(--ink)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
#app{max-width:480px;margin:0 auto;height:100%;display:flex;flex-direction:column;position:relative;overflow:hidden;background:var(--bg)}
.top{display:flex;align-items:center;gap:10px;padding:14px 18px 10px;background:var(--card);border-bottom:1px solid var(--line)}
.logo{width:44px;height:34px;object-fit:cover;border-radius:10px;background:var(--g);color:var(--on);display:grid;place-items:center;font-weight:800;font-size:18px}
.top h1{font-size:20px;font-weight:700;letter-spacing:-.3px;flex:1}
.ib{background:var(--bg);border:1px solid var(--line);color:var(--ink);width:38px;height:38px;border-radius:12px;display:grid;place-items:center;position:relative;cursor:pointer}
.dot{position:absolute;top:-5px;right:-5px;background:var(--p2);color:var(--on);font-size:10px;font-weight:700;min-width:17px;height:17px;border-radius:9px;display:grid;place-items:center;border:2px solid var(--card)}
main{flex:1;overflow-y:auto;padding:14px 16px 20px}
h2.t{font-size:13px;font-weight:600;color:var(--mute);text-transform:uppercase;letter-spacing:.6px;margin:14px 2px 8px}
.sb{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:0 12px;margin-bottom:12px;color:var(--mute)}
.sb input{flex:1;border:0;background:none;padding:12px 0;font-size:15px;color:var(--ink);outline:0}
.chips{display:flex;gap:8px;margin-bottom:12px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--mute);padding:6px 14px;border-radius:20px;font-size:13px;font-weight:600;cursor:pointer}
.chip.on{background:var(--soft);color:var(--p);border-color:transparent}
.row{display:flex;align-items:center;gap:12px;padding:11px 12px;background:var(--card);border-radius:16px;margin-bottom:8px;cursor:pointer;box-shadow:var(--sh)}
.av{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;font-size:17px;flex:none;position:relative}
.av.on::after{content:"";position:absolute;right:0;bottom:0;width:12px;height:12px;border-radius:50%;background:#22c55e;border:2px solid var(--card)}
.grow{flex:1;min-width:0}.grow b{display:block;font-size:15px;font-weight:600}.grow small{color:var(--mute);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;margin-top:2px}
.meta{font-size:11px;color:var(--mute);text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.badge{background:var(--p);color:var(--on);border-radius:10px;padding:1px 7px;font-size:11px;font-weight:700}
.pill{border:0;background:var(--soft);color:var(--p);padding:7px 12px;border-radius:10px;font-size:12px;font-weight:700;cursor:pointer}
nav{display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 8px 4px}
nav button{flex:1;border:0;background:none;padding:6px 0;color:var(--mute);font-size:11px;font-weight:600;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button i{width:52px;height:28px;border-radius:14px;display:grid;place-items:center}
nav button.on{color:var(--p)}nav button.on i{background:var(--soft)}
.btn{border:0;background:var(--g);color:var(--on);padding:13px 24px;border-radius:14px;font-size:15px;font-weight:600;cursor:pointer;box-shadow:0 6px 16px rgba(109,61,240,.3)}
.btn.o{background:var(--card);color:var(--p);box-shadow:none;border:1px solid var(--line)}
.hero{background:var(--card);border-radius:20px;padding:22px 18px;text-align:center;box-shadow:var(--sh);margin-bottom:12px}
.hero p{color:var(--mute);font-size:14px;line-height:1.5;margin:6px 0 16px}
.radar{width:170px;height:170px;margin:4px auto 14px;border-radius:50%;border:1px solid var(--line);position:relative;background:radial-gradient(circle,var(--p) 0 4px,transparent 5px),radial-gradient(circle,transparent 33%,var(--line) 34%,transparent 35%,transparent 66%,var(--line) 67%,transparent 68%)}
.radar::after{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,rgba(128,128,128,.4),transparent 28%);animation:sp 3.2s linear infinite}
.radar i{position:absolute;width:10px;height:10px;border-radius:50%;background:var(--p2);box-shadow:0 0 0 4px rgba(224,71,158,.2)}
@keyframes sp{to{transform:rotate(360deg)}}
.mask{width:84px;height:84px;margin:0 auto 12px;border-radius:26px;background:var(--g);color:var(--on);display:grid;place-items:center;animation:pu 1.4s ease-in-out infinite}
.mask svg{width:40px;height:40px}
@keyframes pu{50%{transform:scale(1.07)}}
.note{display:flex;gap:8px;align-items:center;justify-content:center;color:var(--mute);font-size:12px;margin-top:14px}
.note svg{width:15px;height:15px}
#chat{position:absolute;inset:0;background:var(--bg);display:none;flex-direction:column;z-index:5;padding-top:env(safe-area-inset-top,0px)}
#chat.show{display:flex}
#msgs{flex:1;overflow-y:auto;padding:14px 14px 6px;display:flex;flex-direction:column;gap:4px}
.day{align-self:center;font-size:11px;color:var(--mute);background:var(--card);border:1px solid var(--line);padding:3px 12px;border-radius:12px;margin:4px 0 8px}
.m{max-width:80%;padding:8px 12px 6px;border-radius:18px;font-size:15px;line-height:1.4;background:var(--you);box-shadow:var(--sh);align-self:flex-start;border-bottom-left-radius:5px;overflow-wrap:anywhere}
.m.me{align-self:flex-end;background:var(--g);color:var(--on);border-radius:18px;border-bottom-right-radius:5px;box-shadow:none}
.m time{display:flex;justify-content:flex-end;align-items:center;gap:3px;font-size:10px;opacity:.65;margin-top:2px}
.m time svg{width:13px;height:13px;stroke-width:2.4}
.typing{align-self:flex-start;background:var(--you);padding:11px 14px;border-radius:18px;display:flex;gap:4px;box-shadow:var(--sh)}
.typing b{width:6px;height:6px;border-radius:50%;background:var(--mute);animation:bl 1s infinite}
.typing b:nth-child(2){animation-delay:.2s}.typing b:nth-child(3){animation-delay:.4s}
@keyframes bl{50%{opacity:.25}}
.bar{display:flex;gap:8px;padding:10px 12px;background:var(--card);border-top:1px solid var(--line)}
.bar input{flex:1;padding:12px 16px;border-radius:22px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:15px;outline:0}
.send{width:44px;height:44px;border-radius:50%;border:0;background:var(--g);color:var(--on);display:grid;place-items:center;cursor:pointer}
.ch{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--card);border-bottom:1px solid var(--line)}
.ch .grow b{font-size:16px}.ch .grow small{color:#22c55e;font-weight:600;margin:0}
#panel{position:absolute;top:66px;right:12px;left:12px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:6px;display:none;z-index:9;box-shadow:0 16px 40px rgba(20,10,50,.3)}
#panel.show{display:block}
#panel div{padding:12px;border-radius:12px;font-size:14px;display:flex;gap:10px;align-items:center}
#panel div+div{border-top:1px solid var(--line)}
#panel h4{padding:8px 12px 4px;font-size:13px;color:var(--mute)}
#splash{position:absolute;inset:0;background:#000;z-index:30;display:grid;place-items:center;transition:opacity .5s}#splash img{width:200px;max-width:60%}#splash.hide{opacity:0;pointer-events:none}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.st{background:var(--card);border-radius:16px;padding:12px 4px;text-align:center;box-shadow:var(--sh)}
.st b{display:block;font-size:17px;font-weight:700}.st small{font-size:11px;color:var(--mute)}
.left{text-align:left}.big{font-size:34px;font-weight:800;letter-spacing:-1px}
.two{display:flex;gap:8px;margin-top:12px}.two .btn{flex:1;padding:12px 8px;font-size:14px}
.bars{margin-top:12px}.bars div{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mute);margin:5px 0}
.bars span{flex:1;height:6px;border-radius:3px;background:var(--line);overflow:hidden}.bars span i{display:block;height:100%;background:var(--g)}
.ed{width:100%;margin-bottom:8px}
</style>
</head>

function paint(){var w=$("msgs");w.replaceChildren(el("div","day","Today"));chats[cur].msgs.forEach(function(x){var b=el("div","m"+(x.me?" me":""),x.m),t=el("time","",x.t);if(x.me)t.insertAdjacentHTML("beforeend",ic("check"));b.appendChild(t);w.appendChild(b)});w.scrollTop=w.scrollHeight}
var rep=["Haha nice!","Tell me more","Really? That's cool","Same here","Okay, sounds good!","What are you up to?"];
function send(){var v=$("inp").value.trim();if(!v)return;var k=cur;chats[k].msgs.push({m:v,me:true,t:now()});$("inp").value="";paint();
var ty=el("div","typing");ty.append(el("b"),el("b"),el("b"));$("msgs").appendChild(ty);$("msgs").scrollTop=1e5;
setTimeout(function(){chats[k].msgs.push({m:rep[Math.floor(Math.random()*rep.length)],me:false,t:now()});if(cur===k)paint();else chats[k].unread++},1400)}
$("send").onclick=send;$("inp").onkeydown=function(e){if(e.key==="Enter")send()};
$("back").onclick=function(){$("chat").classList.remove("show");cur=null;render()};
$("skip").onclick=function(){$("back").onclick();tab="rush";render();$("main").querySelector(".btn").click()};
$("nav").onclick=function(e){var b=e.target.closest("button");if(b){tab=b.dataset.t;render()}};
$("newchat").onclick=function(){tab="contacts";render()};
$("bell").onclick=function(){var p=$("panel");p.replaceChildren(el("h4","","Notifications"));notes.forEach(function(n){p.appendChild(el("div","",n))});p.classList.toggle("show");$("cnt").style.display="none"};
var pals=["logo","white"],pi=0;
function setPal(i){pi=i;var r=document.documentElement;r.dataset.pal=pals[i];try{localStorage.setItem("myine-pal3",pals[i])}catch(e){}}
try{var sv=pals.indexOf(localStorage.getItem("myine-pal3"));if(sv>0)setPal(sv)}catch(e){}
$("pal").onclick=function(){setPal((pi+1)%2);var n=el("div","",{logo:"Theme: Myine",white:"Theme: White"}[pals[pi]]);var p=$("panel");p.replaceChildren(n);p.classList.add("show");clearTimeout(window.pt);window.pt=setTimeout(function(){p.classList.remove("show")},1200)};
setTimeout(function(){$("splash").classList.add("hide")},1400);
render();
</script>
</body>
</html>
